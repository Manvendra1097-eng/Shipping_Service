site_name: Learn FastAPI — Tutorial Guide
site_description: A progressive, hands-on tutorial for learning FastAPI by building a real Shipping API
theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
nav:
  - Home: index.md
  - Tutorial:
    - "Chapter 1 — Getting Started": chapters/ch01-getting-started.md
    - "Chapter 2 — Building Endpoints": chapters/ch02-building-endpoints.md
    - "Chapter 3 — Under the Hood": chapters/ch03-under-the-hood.md
    - "Chapter 4 — Pydantic Models": chapters/ch04-pydantic-models.md
    - "Chapter 5 — SQLite (Raw SQL)": chapters/ch05-sqlite.md
    - "Chapter 6 — SQLModel": chapters/ch06-sqlmodel.md
    - "Chapter 7 — PostgreSQL & Async": chapters/ch07-postgres-async.md
  - Concepts:
    - Python Decorators: concepts/decorator.md
    - Path & Query Parameters: concepts/path_and_query_parameter.md
    - Data Validation (Pydantic): concepts/pydantic.md
    - Enumerations (Enums): concepts/enum.md
    - SQLModel & ORMs: concepts/sqlmodel.md
    - Async & Concurrency: concepts/async_concurrency.md
    - APIRouter: concepts/api_router.md
    - Service Layer Pattern: concepts/service_layer.md
    - Config with pydantic-settings: concepts/pydantic_settings.md
plugins:
  - search
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
